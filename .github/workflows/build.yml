      - name: Scan for common crash & build issues
        if: always()
        run: |
          echo "=== BUILD & CODE SCAN REPORT ===" > crash-report.txt
          grep -rnE "!!|ILLEGAL_TRY_CATCH_AROUND_COMPOSABLE|try\s*\{" app/src/main/java || true >> crash-report.txt
          cat crash-report.txt || true
