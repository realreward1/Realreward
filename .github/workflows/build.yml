name: Build Realreward Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Scan crash-prone code patterns
        if: always()
        continue-on-error: true
        run: |
          echo "=== CRASH RISK SCAN ==="
          grep -rn "!!" app/src/main/java || true
          grep -rn "Firebase.auth" app/src/main/java || true
          grep -rn "getCredential" app/src/main/java || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
